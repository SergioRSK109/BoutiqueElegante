<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Catalogue &amp; précommande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F2;--surface:#FFFFFF;--ink:#241B2F;--ink-soft:#6b5f72;
    --accent:#7C2D4A;--accent-light:#B85C7A;--gold:#B8923F;--danger:#A8432F;--good:#3F6B4E;--line:#E7DED2;--radius:14px;
    --header-bg:#2d3a50;
    --shadow-sm:0 1px 3px rgba(36,27,47,.07);
    --shadow-md:0 12px 28px rgba(36,27,47,.13);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  h1,h2,h3{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:760px;margin:0 auto;padding:132px 18px 110px;}
  .site-header{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--header-bg);display:flex;align-items:flex-end;gap:12px;padding:16px 16px 0;box-shadow:0 2px 10px rgba(36,27,47,.18);}
  .logo-medallion{width:104px;height:104px;min-width:104px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .logo-medallion img{width:101%;height:101%;object-fit:contain;display:block;}
  .header-text{flex:1;min-width:0;text-align:right;height:52px;display:flex;flex-direction:column;justify-content:center;align-self:center;}
  .header-name-line{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin:0 0 2px;line-height:14px;}
  .header-name-line .name-text{font-family:'Fraunces',serif;font-weight:500;font-size:12px;line-height:14px;color:#FBF7F2;}
  .header-name-line .cart-icon{font-size:12px;line-height:14px;color:#FBF7F2;}
  .header-info-line{font-size:9px;color:#c9cddb;line-height:1.35;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
  .header-info-line .header-icon{flex-shrink:0;width:10px;height:10px;}
  .page-intro{text-align:center;margin-bottom:18px;}
  .page-intro h1{font-size:1.6rem;margin:0 0 4px;}
  .page-intro p{font-family:'Fraunces',serif;font-size:14px;color:#241B2F;text-align:center;margin:0 0 14px;line-height:1.5;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* bandeau défilant */
  .carousel-wrap{margin-bottom:28px;}
  .carousel-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:0 0 10px;font-weight:600;text-align:center;}
  .carousel{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .carousel::-webkit-scrollbar{height:6px;}
  .carousel::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
  .carousel-item{flex:0 0 auto;width:148px;scroll-snap-align:start;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;}
  .carousel-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent-light);}
  .carousel-item .photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--bg);}
  .carousel-item .info{padding:9px 11px 11px;}
  .carousel-item .nom{font-family:'Fraunces';font-weight:600;font-size:.82rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .carousel-item .prix{font-family:'IBM Plex Mono';color:var(--accent);font-weight:700;font-size:.78rem;}

  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;-webkit-overflow-scrolling:touch;}
  .cat-chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:.82rem;cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease;}
  .cat-chip:hover{border-color:var(--accent-light);color:var(--accent);}
  .cat-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .grid-articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;}
  .article-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;}
  .article-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--accent-light);}
  .article-card.epuise{opacity:.68;}
  .article-card .photo-wrap{position:relative;width:100%;aspect-ratio:4/5;background:linear-gradient(135deg,#f4e9ec,#f0e4d9);overflow:hidden;}
  .badge-epuise{position:absolute;top:16px;left:-40px;width:165px;text-align:center;transform:rotate(-40deg);background:var(--danger);color:#fff;font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:5px 0;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .article-card .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .article-card .photo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .article-card .photo-placeholder img{width:44%;height:auto;opacity:.4;}
  .article-card .info{padding:13px 15px 15px;}
  .article-card .nom{font-family:'Fraunces';font-weight:600;font-size:1.02rem;margin-bottom:3px;line-height:1.25;}
  .article-card .cat{color:var(--ink-soft);font-size:.68rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
  .article-card .prix{font-family:'IBM Plex Mono';font-weight:700;color:var(--accent);font-size:1.02rem;}
  .article-card .stock-note{font-size:.7rem;color:var(--ink-soft);margin-top:5px;}
  .empty{color:var(--ink-soft);font-size:.85rem;padding:34px;text-align:center;}

  .modal-bg{position:fixed;inset:0;background:rgba(36,27,47,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(36,27,47,.25);}
  .modal h3{margin-top:0;}
  .modal-photo-large{width:100%;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,#f4e9ec,#f0e4d9);animation:fadeInPhoto .25s ease;}
  .modal-photo-large img{width:100%;height:100%;object-fit:cover;display:block;}
  .modal-photo-large .photo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .modal-photo-large .photo-placeholder img{width:44%;height:auto;object-fit:contain;opacity:.4;}
  @keyframes fadeInPhoto{from{opacity:0;}to{opacity:1;}}
  .modal-cat{color:var(--ink-soft);font-size:.72rem;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
  .variant-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.8rem;cursor:pointer;font-family:'IBM Plex Mono';transition:background .18s ease,border-color .18s ease,color .18s ease;}
  .chip:hover{border-color:var(--accent-light);}
  .chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chip.disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through;}
  .chip-thumb{width:22px;height:22px;border-radius:50%;object-fit:cover;margin-right:6px;flex-shrink:0;}
  .qty-stepper{display:flex;align-items:center;gap:10px;}
  .qty-stepper button{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.1rem;cursor:pointer;transition:border-color .18s ease;}
  .qty-stepper button:hover{border-color:var(--accent-light);}
  .qty-stepper input{width:60px;text-align:center;font-family:'IBM Plex Mono';font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:16px;}
  label{display:block;font-size:.76rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text],input[type=tel]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:'Inter';font-size:16px;color:var(--ink);transition:border-color .18s ease;}
  input[type=text]:focus,input[type=tel]:focus{outline:none;border-color:var(--accent-light);}
  .field{margin-bottom:14px;}
  button.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font-weight:600;font-size:.86rem;border-radius:8px;border:1px solid transparent;padding:10px 16px;cursor:pointer;font-family:'Inter';transition:background .18s ease,border-color .18s ease,color .18s ease,transform .1s ease;}
  button.btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:#671f3c;} .btn-primary:disabled{background:#c9b7bf;cursor:not-allowed;}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);} .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-whatsapp{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#25D366;color:#fff;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .radio-option{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:400;text-transform:none;letter-spacing:normal;font-size:.86rem;color:var(--ink);cursor:pointer;}

  /* panier flottant */
  #panierBar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:14px 18px;display:none;align-items:center;justify-content:space-between;z-index:40;box-shadow:0 -8px 24px rgba(36,27,47,.18);}
  #panierBar.show{display:flex;}
  #panierBar .info{font-size:.86rem;}
  #panierBar .info .mono{color:var(--gold);font-weight:700;}
  #panierBar button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#fff;color:var(--ink);border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .15s ease;}
  #panierBar button:hover{transform:translateY(-1px);}

  /* panier modal */
  .panier-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .panier-item:last-child{border-bottom:none;}
  .panier-item .d{font-size:.85rem;} .panier-item .d .sub{color:var(--ink-soft);font-size:.74rem;}
  .panier-item .rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;}
  .total-line{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:10px;border-top:1px dashed var(--line);}
  .total-line .val{font-family:'IBM Plex Mono';font-weight:700;font-size:1.3rem;color:var(--accent);}

  /* facture / invoice */
  .facture{font-family:'IBM Plex Mono',monospace;font-size:.86rem;border:1px dashed var(--ink);border-radius:8px;padding:18px;}
  .facture h3{font-family:'IBM Plex Mono';margin:0 0 4px;}
  .facture hr{border:none;border-top:1px dashed var(--line);margin:10px 0;}
  .facture .l{display:flex;justify-content:space-between;margin-bottom:4px;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;top:0;left:0;width:100%;}
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="logo-medallion">
    <img src="logo.png" alt="Elégante Boutique">
  </div>
  <div class="header-text">
    <div class="header-name-line">
      <span class="name-text" id="headerShopName">Boutique</span>
      <span class="cart-icon">🛍</span>
    </div>
    <div class="header-info-line" id="headerAirtelLine" style="display:none;">
      <span id="headerAirtelText"></span>
      <svg class="header-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="1" width="10" height="22" rx="2"/></svg>
    </div>
    <div class="header-info-line" id="headerOrangeLine" style="display:none;">
      <span id="headerOrangeText"></span>
      <svg class="header-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="1" width="10" height="22" rx="2"/></svg>
    </div>
    <div class="header-info-line" id="headerAddressLine" style="display:none;">
      <span id="headerAddressText"></span>
      <svg class="header-icon" width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C7.58 2 4 5.58 4 10c0 6 8 12 8 12s8-6 8-12c0-4.42-3.58-8-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
    </div>
  </div>
</header>
<div id="app">
  <div class="page-intro">
    <h1 id="shopTitle" class="sr-only">Boutique</h1>
    <p>Parcourez, choisissez taille et couleur, réservez en quelques clics.</p>
  </div>
  <div id="carouselWrap" class="carousel-wrap" style="display:none;"></div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="grid-articles" id="grid"></div>
</div>

<div id="panierBar">
  <div class="info"><span id="panierCount">0</span> article(s) · <span class="mono" id="panierTotal">0</span></div>
  <button onclick="openPanier()">Voir le panier</button>
</div>

<div id="modal-root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, getDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =======================================================
   COLLE ICI LA MÊME CONFIGURATION FIREBASE QUE DANS interne.html
======================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBK34f5S6tgz4w1yg7Bvhi7FdQsmqzUz9Q",
  authDomain: "boutiqueelegante.firebaseapp.com",
  projectId: "boutiqueelegante",
  storageBucket: "boutiqueelegante.firebasestorage.app",
  messagingSenderId: "915612497837",
  appId: "1:915612497837:web:47d9d548bbd4d175565324",
  measurementId: "G-GD4LWF7XQ4"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
try{ await enableIndexedDbPersistence(db); }catch(e){}

window.__fb = { db, collection, doc, addDoc, getDoc, onSnapshot };
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
let articles = [];
let meta = { devise:'$', whatsapp:'', nomBoutique:'Boutique', adresse:{} };
let activeCat = 'Toutes';
let panier = []; // {articleId, articleNom, variantId, taille, couleur, qte, prixVenteUnit, maxStock}
let modePaiementChoisi = null;
let panierClientNom = '';
let panierClientTel = '';

function shortenReference(text){
  if(!text) return '';
  let t = String(text).trim();
  t = t.replace(/^(en face de|à c[oô]té de|pr[eè]s de|devant|derri[eè]re|au niveau de)\s+(la |le |l['’])?/i, '').trim();
  const words = t.split(/\s+/).filter(Boolean);
  if(words.length <= 3) return t;
  const short = [words[0], ...words.slice(-2)].join(' ');
  return short.charAt(0).toUpperCase() + short.slice(1);
}

window.addEventListener('fb-ready', ()=>{
  const { db, collection, doc, onSnapshot, getDoc } = window.__fb;
  onSnapshot(collection(db,'articles'), snap=>{
    articles = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(a=> !a.supprime);
    renderCategories(); renderCarousel(); renderGrid();
  });
  getDoc(doc(db,'meta','config')).then(d=>{
    if(d.exists()){
      meta = Object.assign(meta, d.data());
      renderCategories();
      document.getElementById('shopTitle').textContent = meta.nomBoutique || 'Boutique';
      document.getElementById('headerShopName').textContent = meta.nomBoutique || 'Boutique';

      const a = meta.adresse || {};
      const addrParts = [a.quartier, a.ville].filter(Boolean);
      let addrText = addrParts.join(', ');
      if(a.reference){ addrText += (addrText ? ', ' : '') + 'Réf: '+shortenReference(a.reference); }
      const addressLine = document.getElementById('headerAddressLine');
      if(addrText){
        document.getElementById('headerAddressText').textContent = addrText;
        addressLine.style.display = 'flex';
      } else {
        addressLine.style.display = 'none';
      }

      const pm = meta.paiementMobile || {};
      const airtelLine = document.getElementById('headerAirtelLine');
      if(pm.airtel){
        document.getElementById('headerAirtelText').textContent = 'Airtel Money : '+pm.airtel;
        airtelLine.style.display = 'flex';
      } else {
        airtelLine.style.display = 'none';
      }
      const orangeLine = document.getElementById('headerOrangeLine');
      if(pm.orange){
        document.getElementById('headerOrangeText').textContent = 'Orange Money : '+pm.orange;
        orangeLine.style.display = 'flex';
      } else {
        orangeLine.style.display = 'none';
      }
    }
  });
});

function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+meta.devise; }
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function variantLabel(v){ const p=[]; if(v.taille) p.push(v.taille); if(v.couleur) p.push(v.couleur); return p.length? p.join(' / '):'Standard'; }
function totalStock(a){ return (a.variants||[]).reduce((s,v)=>s+(v.stock||0),0); }
function variantPhotoUrl(article, variant){
  return (variant && variant.photoUrl) || (article && article.photoUrl) || '';
}
function sortCategoriesByCount(cats, articlesList){
  const counts = {};
  cats.forEach(c=> counts[c]=0);
  articlesList.forEach(a=>{ if(a.categorie && counts.hasOwnProperty(a.categorie)) counts[a.categorie]++; });
  return [...cats].sort((a,b)=> counts[b]!==counts[a] ? counts[b]-counts[a] : a.localeCompare(b,'fr'));
}
const JOURS_EXPIRATION_EPUISE = 90;
function estEpuiseExpire(a){
  if(!a.stockZeroDepuis) return false;
  const jours = (Date.now() - new Date(a.stockZeroDepuis).getTime()) / 86400000;
  return jours >= JOURS_EXPIRATION_EPUISE;
}
function paiementMobileTexte(){
  const pm = meta.paiementMobile || {};
  const parts = [];
  if(pm.airtel) parts.push('Airtel Money ('+pm.airtel+')');
  if(pm.orange) parts.push('Orange Money ('+pm.orange+')');
  if(parts.length===0) return '';
  return 'Vous pouvez aussi payer via '+parts.join(' ou ')+'.';
}

const FRAIS_RETRAIT_PCT = 1.5;
const FRAIS_CASH_PCT = 3;

function libelleModePaiement(mode){
  if(mode==='boutique') return 'Paiement en boutique (espèces)';
  if(mode==='airtel') return 'Airtel Money';
  if(mode==='orange') return 'Orange Money';
  return '';
}

function calculFrais(sousTotal, mode){
  if(mode==='airtel' || mode==='orange'){
    const fraisRetrait = sousTotal * FRAIS_RETRAIT_PCT/100;
    const fraisCash = sousTotal * FRAIS_CASH_PCT/100;
    const montantFrais = fraisRetrait + fraisCash;
    return { mode, sousTotal, fraisPourcent: FRAIS_RETRAIT_PCT+FRAIS_CASH_PCT, fraisRetrait, fraisCash, montantFrais, total: sousTotal + montantFrais };
  }
  return { mode, sousTotal, fraisPourcent: 0, fraisRetrait: 0, fraisCash: 0, montantFrais: 0, total: sousTotal };
}

function renderRecapPaiement(sousTotal, mode){
  const c = calculFrais(sousTotal, mode);
  if(c.fraisPourcent<=0){
    return `<div class="total-line"><span>Total à payer</span><span class="val">${money(c.total)}</span></div>`;
  }
  return `
    <div style="margin-top:10px;font-size:.85rem;">
      <div class="l" style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Sous-total articles</span><span class="mono">${money(c.sousTotal)}</span></div>
      <div class="l" style="display:flex;justify-content:space-between;margin-bottom:4px;color:var(--ink-soft);"><span>Frais retrait mobile money (${FRAIS_RETRAIT_PCT}%)</span><span class="mono">${money(c.fraisRetrait)}</span></div>
      <div class="l" style="display:flex;justify-content:space-between;margin-bottom:4px;color:var(--ink-soft);"><span>Frais accès cash (${FRAIS_CASH_PCT}%)</span><span class="mono">${money(c.fraisCash)}</span></div>
    </div>
    <div class="total-line"><span>TOTAL À PAYER</span><span class="val">${money(c.total)}</span></div>
  `;
}

function renderCategories(){
  const cats = ['Toutes', ...sortCategoriesByCount(meta.categories||[], articles)];
  document.getElementById('catTabs').innerHTML = cats.map(c=> `<button class="cat-chip ${c===activeCat?'active':''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');
}
function setCat(c){ activeCat = c; renderCategories(); renderGrid(); }

function renderCarousel(){
  const wrap = document.getElementById('carouselWrap');
  if(!wrap) return;
  const list = articles.filter(a=> a.photoUrl && totalStock(a)>0);
  if(list.length===0){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='';
  wrap.innerHTML = `
    <div class="carousel-title">Nouveautés &amp; coups de cœur</div>
    <div class="carousel">
      ${list.map(a=> `
        <div class="carousel-item" onclick="openArticle('${a.id}')">
          <img class="photo" src="${esc(a.photoUrl)}" alt="${esc(a.nom)}" loading="lazy">
          <div class="info">
            <div class="nom">${esc(a.nom)}</div>
            <div class="prix">${money(a.prixVente)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderGrid(){
  const list = articles.filter(a=> (activeCat==='Toutes' || a.categorie===activeCat) && (totalStock(a)>0 || !estEpuiseExpire(a)));
  const grid = document.getElementById('grid');
  if(list.length===0){ grid.innerHTML = '<div class="empty">Aucun article disponible pour le moment.</div>'; return; }
  grid.innerHTML = list.map(a=>{
    const epuise = totalStock(a)===0;
    return `
    <div class="article-card ${epuise?'epuise':''}" onclick="openArticle('${a.id}')">
      <div class="photo-wrap">
        ${epuise ? '<div class="badge-epuise">Épuisé</div>' : ''}
        ${a.photoUrl
          ? `<img src="${esc(a.photoUrl)}" alt="${esc(a.nom)}" loading="lazy">`
          : `<div class="photo-placeholder"><img src="logo.png" alt=""></div>`}
      </div>
      <div class="info">
        <div class="nom">${esc(a.nom)}</div>
        <div class="cat">${esc(a.categorie||'')}</div>
        <div class="prix">${money(a.prixVente)}</div>
        <div class="stock-note">${epuise ? 'Actuellement épuisé' : (a.variants||[]).length+' variante(s) disponible(s)'}</div>
      </div>
    </div>
  `;
  }).join('');
}

let currentArticle = null, currentVariantId = null, currentQte = 1;
function openArticle(id){
  currentArticle = articles.find(a=>a.id===id);
  currentVariantId = null; currentQte = 1;
  openModal(renderArticleModal());
}
function renderArticleModal(){
  const a = currentArticle;
  const variant = (a.variants||[]).find(v=>v.id===currentVariantId);
  const maxQ = variant? variant.stock : 1;
  const photoUrl = variantPhotoUrl(a, variant);
  return `
    <div class="modal-photo-large">
      ${photoUrl
        ? `<img src="${esc(photoUrl)}" alt="${esc(a.nom)}">`
        : `<div class="photo-placeholder"><img src="logo.png" alt=""></div>`}
    </div>
    <h3>${esc(a.nom)}</h3>
    <div class="mono" style="color:var(--accent);font-weight:700;font-size:1.1rem;margin-bottom:6px;">${money(a.prixVente)}</div>
    ${a.categorie ? `<div class="modal-cat">${esc(a.categorie)}</div>` : ''}
    ${totalStock(a)===0 ? '<p style="color:var(--danger);font-weight:600;font-size:.85rem;margin:0 0 10px;">Cet article est actuellement épuisé.</p>' : ''}
    <label>Choisissez une variante</label>
    <div class="variant-chips">
      ${(a.variants||[]).map(v=>{
        const disabled = (v.stock||0)<=0, selected = currentVariantId===v.id;
        const thumbUrl = variantPhotoUrl(a, v);
        return `<button class="chip ${selected?'selected':''} ${disabled?'disabled':''}" ${disabled?'disabled':''} onclick="pickVariant('${v.id}')">${thumbUrl?`<img class="chip-thumb" src="${esc(thumbUrl)}" alt="">`:''}${esc(variantLabel(v))}</button>`;
      }).join('') || '<span class="muted">Aucune variante.</span>'}
    </div>
    ${currentVariantId? `
      <div class="field"><label>Quantité</label>
        <div class="qty-stepper">
          <button onclick="qtyDelta(-1)">−</button>
          <input type="number" value="${currentQte}" min="1" max="${maxQ}" oninput="qtySet(this.value, ${maxQ})">
          <button onclick="qtyDelta(1)">+</button>
          <span class="muted">/ ${maxQ} dispo</span>
        </div>
      </div>
    `:''}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn btn-primary" ${!currentVariantId?'disabled':''} onclick="addToPanier()">Ajouter au panier</button>
    </div>
  `;
}
function pickVariant(vid){ currentVariantId = vid; currentQte = 1; syncArticleModal(); }
function qtyDelta(d){ const variant=currentArticle.variants.find(v=>v.id===currentVariantId); const max=variant?variant.stock:1; currentQte=Math.min(max,Math.max(1,currentQte+d)); syncArticleModal(); }
function qtySet(val,max){ let q=parseInt(val,10); if(isNaN(q)||q<1)q=1; if(q>max)q=max; currentQte=q; syncArticleModal(); }
function syncArticleModal(){ document.getElementById('modal-root').querySelector('.modal').innerHTML = renderArticleModal(); }

function addToPanier(){
  const a = currentArticle, variant = a.variants.find(v=>v.id===currentVariantId);
  const existing = panier.find(p=> p.articleId===a.id && p.variantId===variant.id);
  if(existing){ existing.qte = Math.min(variant.stock, existing.qte + currentQte); }
  else{
    panier.push({ articleId:a.id, articleNom:a.nom, variantId:variant.id, taille:variant.taille||'', couleur:variant.couleur||'', qte:currentQte, prixVenteUnit:a.prixVente, maxStock:variant.stock });
  }
  closeModal(); updatePanierBar();
}

function updatePanierBar(){
  const bar = document.getElementById('panierBar');
  const count = panier.reduce((s,p)=>s+p.qte,0);
  const total = panier.reduce((s,p)=>s+p.qte*p.prixVenteUnit,0);
  document.getElementById('panierCount').textContent = count;
  document.getElementById('panierTotal').textContent = money(total);
  bar.classList.toggle('show', panier.length>0);
}

function openPanier(){ openModal(renderPanierModal()); }
function renderPanierModal(){
  if(panier.length===0) return `<h3>Panier</h3><div class="empty">Votre panier est vide.</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button></div>`;
  const sousTotal = panier.reduce((s,p)=>s+p.qte*p.prixVenteUnit,0);
  return `
    <h3>Votre panier</h3>
    ${panier.map((p,i)=>`
      <div class="panier-item">
        <div class="d">${esc(p.articleNom)}<div class="sub">${esc([p.taille,p.couleur].filter(Boolean).join(' / ')||'Standard')} × ${p.qte}</div></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="mono">${money(p.qte*p.prixVenteUnit)}</span>
          <button class="rm" onclick="removeFromPanier(${i})">✕</button>
        </div>
      </div>
    `).join('')}
    <div class="field" style="margin-top:16px;">
      <label>Mode de paiement</label>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <label class="radio-option">
          <input type="radio" name="modePaiement" value="boutique" ${modePaiementChoisi==='boutique'?'checked':''} onchange="selectModePaiement('boutique')">
          Je passerai payer en boutique (espèces)
        </label>
        <label class="radio-option">
          <input type="radio" name="modePaiement" value="airtel" ${modePaiementChoisi==='airtel'?'checked':''} onchange="selectModePaiement('airtel')">
          Je paierai par Airtel Money
        </label>
        <label class="radio-option">
          <input type="radio" name="modePaiement" value="orange" ${modePaiementChoisi==='orange'?'checked':''} onchange="selectModePaiement('orange')">
          Je paierai par Orange Money
        </label>
      </div>
    </div>
    ${modePaiementChoisi
      ? renderRecapPaiement(sousTotal, modePaiementChoisi)
      : `<div class="total-line"><span>Total</span><span class="val">${money(sousTotal)}</span></div><p class="muted" style="margin-top:6px;font-size:.78rem;color:var(--ink-soft);">Choisissez un mode de paiement pour continuer.</p>`}
    <div class="field" style="margin-top:16px;"><label>Votre nom</label><input type="text" id="clientNom" value="${esc(panierClientNom)}" oninput="panierClientNom=this.value" placeholder="Nom et prénom"></div>
    <div class="field"><label>Votre téléphone</label><input type="tel" id="clientTel" value="${esc(panierClientTel)}" oninput="panierClientTel=this.value" placeholder="Ex : 0700000000"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Continuer mes achats</button>
      <button class="btn btn-primary" ${!modePaiementChoisi?'disabled':''} onclick="creerFacture()">Générer la facture</button>
    </div>
  `;
}
function selectModePaiement(mode){ modePaiementChoisi = mode; openModal(renderPanierModal()); }
function removeFromPanier(i){
  panier.splice(i,1); updatePanierBar();
  if(panier.length===0){ closeModal(); modePaiementChoisi = null; panierClientNom=''; panierClientTel=''; }
  else openModal(renderPanierModal());
}

async function creerFacture(){
  const clientNom = document.getElementById('clientNom').value.trim();
  const clientTelephone = document.getElementById('clientTel').value.trim();
  if(!clientNom){ alert("Merci d'indiquer votre nom."); return; }
  if(!modePaiementChoisi){ alert("Merci de choisir un mode de paiement."); return; }
  const { db, collection, addDoc } = window.__fb;
  const sousTotal = panier.reduce((s,p)=>s+p.qte*p.prixVenteUnit,0);
  const c = calculFrais(sousTotal, modePaiementChoisi);
  const items = panier.map(p=> ({ articleId:p.articleId, articleNom:p.articleNom, variantId:p.variantId, taille:p.taille, couleur:p.couleur, qte:p.qte, prixVenteUnit:p.prixVenteUnit }));
  const docRef = await addDoc(collection(db,'precommandes'), {
    date: new Date().toISOString(), clientNom, clientTelephone, items,
    modePaiement: c.mode, sousTotal: c.sousTotal, fraisPourcent: c.fraisPourcent, montantFrais: c.montantFrais, total: c.total,
    statut:'non_payé'
  });
  const commandeId = docRef.id.slice(0,6).toUpperCase();
  openModal(renderFactureModal(commandeId, clientNom, clientTelephone, items, c));
  panier = []; modePaiementChoisi = null; panierClientNom = ''; panierClientTel = ''; updatePanierBar();
}

function renderFactureModal(commandeId, clientNom, clientTelephone, items, c){
  const dateStr = new Date().toLocaleString('fr-FR');
  const lignesTexte = items.map(it=> `- ${it.articleNom} (${[it.taille,it.couleur].filter(Boolean).join(' / ')||'Standard'}) x${it.qte} = ${money(it.qte*it.prixVenteUnit)}`).join('\n');
  const modeTexte = libelleModePaiement(c.mode);
  const fraisTexte = c.fraisPourcent>0
    ? `Sous-total articles : ${money(c.sousTotal)}\nFrais retrait mobile money (${FRAIS_RETRAIT_PCT}%) : ${money(c.fraisRetrait)}\nFrais accès cash (${FRAIS_CASH_PCT}%) : ${money(c.fraisCash)}\nTOTAL À PAYER : ${money(c.total)}`
    : `TOTAL À PAYER : ${money(c.total)}`;
  let message = `Bonjour, voici ma précommande #${commandeId} (${meta.nomBoutique||'boutique'}) :\n${lignesTexte}\nMode de paiement : ${modeTexte}\n${fraisTexte}\nNom : ${clientNom}\nTéléphone : ${clientTelephone}\n\nJe passerai payer et récupérer en boutique. Merci !`;
  const pmTexte = paiementMobileTexte();
  if(pmTexte){ message += `\n\n${pmTexte}`; }
  const waLink = meta.whatsapp ? `https://wa.me/${meta.whatsapp.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(message)}` : null;
  return `
    <div id="printArea">
      <div class="facture">
        <img src="logo.png" alt="Elégante Boutique" style="display:block;margin:0 auto 8px;height:70px;width:auto;">
        <h3 style="text-align:center;">${esc(meta.nomBoutique||'Boutique')}</h3>
        <div class="l"><span>Commande</span><span>#${commandeId}</span></div>
        <div class="l"><span>Date</span><span>${dateStr}</span></div>
        <div class="l"><span>Client</span><span>${esc(clientNom)}</span></div>
        <div class="l"><span>Téléphone</span><span>${esc(clientTelephone)}</span></div>
        <div class="l"><span>Mode de paiement</span><span>${esc(modeTexte)}</span></div>
        <hr>
        ${items.map(it=> `<div class="l"><span>${esc(it.articleNom)} (${esc([it.taille,it.couleur].filter(Boolean).join(' / ')||'Standard')}) ×${it.qte}</span><span>${money(it.qte*it.prixVenteUnit)}</span></div>`).join('')}
        <hr>
        <div class="l"><span>Sous-total articles</span><span>${money(c.sousTotal)}</span></div>
        ${c.fraisPourcent>0 ? `
        <div class="l"><span>Frais retrait mobile money (${FRAIS_RETRAIT_PCT}%)</span><span>${money(c.fraisRetrait)}</span></div>
        <div class="l"><span>Frais accès cash (${FRAIS_CASH_PCT}%)</span><span>${money(c.fraisCash)}</span></div>
        ` : ''}
        <div class="l" style="font-weight:700;"><span>TOTAL À PAYER${c.fraisPourcent>0?'':' EN BOUTIQUE'}</span><span>${money(c.total)}</span></div>
        ${paiementMobileTexte() ? `<div style="margin-top:8px;font-size:.78rem;color:var(--ink-soft);">${esc(paiementMobileTexte())}</div>` : ''}
      </div>
    </div>
    <p class="muted" style="margin-top:14px;font-size:.82rem;">Envoyez cette facture à la boutique pour réserver vos articles, puis passez payer et récupérer sur place.</p>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="window.print()">🖨 Imprimer / enregistrer en PDF</button>
      ${waLink ? `<a class="btn btn-whatsapp" href="${waLink}" target="_blank" style="text-decoration:none;display:inline-block;">Envoyer sur WhatsApp</a>` : ''}
      <button class="btn btn-primary" onclick="closeModal()">Terminé</button>
    </div>
  `;
}

function openModal(html){ document.getElementById('modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
</script>
</body>
</html>
