<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  getDoc, getDocs, onSnapshot, query, orderBy, runTransaction,
  enableIndexedDbPersistence, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* =======================================================
   1) COLLE ICI LA CONFIGURATION DE TON PROJET FIREBASE
   (Console Firebase > Paramètres du projet > Vos applications > Web)
======================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBK34f5S6tgz4w1yg7Bvhi7FdQsmqzUz9Q",
  authDomain: "boutiqueelegante.firebaseapp.com",
  projectId: "boutiqueelegante",
  storageBucket: "boutiqueelegante.firebasestorage.app",
  messagingSenderId: "915612497837",
  appId: "1:915612497837:web:47d9d548bbd4d175565324",
  measurementId: "G-GD4LWF7XQ4"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
try{ await enableIndexedDbPersistence(db); }catch(e){ console.warn('Persistance hors-ligne non activée:', e.message); }

window.addEventListener('online', ()=> setConnStatus(true));
window.addEventListener('offline', ()=> setConnStatus(false));
function setConnStatus(online){
  const dot = document.getElementById('syncDot');
  if(!dot) return;
  dot.classList.toggle('off', !online);
  dot.title = online ? 'Synchronisé' : 'Hors-ligne';
}
setConnStatus(navigator.onLine);

/* expose firestore + auth helpers to the rest of the app (non-module script below) */
window.__fb = { db, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot, query, orderBy, runTransaction, serverTimestamp };

let alreadyWired = false;
onAuthStateChanged(auth, (user) => {
  const loginScreen = document.getElementById('loginScreen');
  const app = document.getElementById('app');
  const siteHeader = document.getElementById('siteHeader');
  if(user){
    window.__currentVendeuse = user.email ? user.email.split('@')[0] : '';
    loginScreen.classList.add('hidden');
    app.classList.remove('hidden');
    siteHeader.classList.remove('hidden');
    if(!alreadyWired){ alreadyWired = true; window.dispatchEvent(new Event('fb-ready')); }
  } else {
    window.__currentVendeuse = '';
    loginScreen.classList.remove('hidden');
    app.classList.add('hidden');
    siteHeader.classList.add('hidden');
  }
});

window.__doLogin = async (email, password) => {
  try{
    await signInWithEmailAndPassword(auth, email, password);
    return null;
  }catch(e){
    if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
      return 'Email ou mot de passe incorrect.';
    }
    return 'Erreur de connexion : ' + e.message;
  }
};
window.__doLogout = () => signOut(auth);
</script>


<script>
/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let state = {
  articles: [], ventes: [], pertes: [], precommandes: [],
  meta: {
    nomBoutique: 'ELEGANTE BOUTIQUE',
    devise: '$',
    seuil: 3,
    vendeuses: [],
    categories: ['Sac à main','Bijoux','Bracelet','Drap','Porte-clé','Petit Tapis','Grand Tapis','Pyjama','Parfum'],
    whatsapp: '243071080048',
    adresse: { province:'Nord Kivu', ville:'Goma', quartier:'Katindo', reference:'En face de la salle polyvalente Saint Cyril' },
    paiementMobile: { airtel: '0971080048', orange: '0841747264' }
  },
  tab: 'dashboard',
  vente: { query:'', results:[], article:null, variantId:null, qte:1, vendeuse:'' },
  perte: { query:'', results:[], article:null, variantId:null, qte:1, raison:'Abîmé / endommagé', vendeuse:'' },
  loaded:false
};

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+state.meta.devise; }
function todayISO(){ return new Date().toISOString(); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function esc(str){ const d=document.createElement('div'); d.textContent = str==null?'':String(str); return d.innerHTML; }
function variantLabel(v){ const p=[]; if(v.taille) p.push(v.taille); if(v.couleur) p.push(v.couleur); return p.length? p.join(' / '):'Standard'; }
function totalStock(a){ return (a.variants||[]).reduce((s,v)=>s+(v.stock||0),0); }
const JOURS_AUTO_CORBEILLE = 60;
let autoCorbeilleChecked = false;
async function runAutoCorbeille(){
  const { db, doc, updateDoc } = window.__fb;
  const seuil = Date.now() - JOURS_AUTO_CORBEILLE*86400000;
  const candidats = state.articles.filter(a=> !a.supprime && totalStock(a)===0 && a.stockZeroDepuis && new Date(a.stockZeroDepuis).getTime()<=seuil);
  for(const a of candidats){
    try{

function computeStats(){
  let valeurAchat=0, valeurVente=0, stockUnits=0; const lowStock=[];
  state.articles.filter(a=> !a.supprime).forEach(a=> (a.variants||[]).forEach(v=>{
    valeurAchat += (v.stock||0)*(a.prixAchat||0);
    valeurVente += (v.stock||0)*(a.prixVente||0);
    stockUnits += (v.stock||0);
    if((v.stock||0) <= state.meta.seuil) lowStock.push({article:a, variant:v});
  }));
  const ca = state.ventes.reduce((s,v)=> s+(v.total||0),0);
  const profit = state.ventes.reduce((s,v)=> s+(v.profit||0),0);
  const pertesValeur = state.pertes.reduce((s,p)=> s+(p.qte||0)*(p.prixAchatUnit||0),0);
  const today = new Date().toDateString();
  const ventesJour = state.ventes.filter(v=> v.date && new Date(v.date).toDateString()===today);
  const caJour = ventesJour.reduce((s,v)=> s+(v.total||0),0);
  const enAttente = state.precommandes.filter(p=> p.statut==='non_payé');
  return { valeurAchat, valeurVente, stockUnits, lowStock, ca, profit, pertesValeur, ventesJour, caJour, enAttente };
}

      <div class="tag-card"><div class="label">Valeur du stock (vente)</div><div class="value">${money(s.valeurVente)}</div><div class="hint">potentiel si tout est vendu</div></div>
      <div class="tag-card"><div class="label">Chiffre d'affaires total</div><div class="value accent">${money(s.ca)}</div><div class="hint">${state.ventes.length} ventes enregistrées</div></div>
      <div class="tag-card"><div class="label">Bénéfice net</div><div class="value ${beneficeNet>=0?'good':'danger'}">${money(beneficeNet)}</div><div class="hint">ventes − coût des pertes</div></div>
      <div class="tag-card"><div class="label">Pertes (valeur)</div><div class="value danger">${money(s.pertesValeur)}</div><div class="hint">${state.pertes.length} déclarations</div></div>
      <div class="tag-card"><div class="label">Précommandes en attente</div><div class="value ${s.enAttente.length?'danger':'good'}">${s.enAttente.length}</div><div class="hint">à traiter dans l'onglet dédié</div></div>
    </div>
    <div class="grid two">
      <div class="card">
        <div class="flex-between" style="margin-bottom:14px;"><div class="section-title" style="margin:0;">Stock faible</div><span class="muted">seuil : ${state.meta.seuil}</span></div>
        ${s.lowStock.length===0? '<div class="empty">Aucun article en stock faible.</div>' : `
          <div class="scroll-x"><table><thead><tr><th>Article</th><th>Variante</th><th class="num">Stock</th></tr></thead><tbody>

          <div style="background:var(--bg);border-radius:6px;height:8px;overflow:hidden;"><div style="background:var(--accent);height:100%;width:${(qty/maxQty)*100}%;"></div></div></div>

  return `

function renderQtyAndSubmit(ctx){
  const v = state[ctx];
  const variant = (v.article.variants||[]).find(x=> x.id===v.variantId);
  const maxQ = variant? variant.stock:1;
  const total = v.qte * v.article.prixVente;
  return `
    <div class="field" style="margin-top:12px;"><label>Quantité</label>
      <div class="qty-stepper"><button onclick="changeQty('${ctx}',-1)">−</button>
        <input type="number" value="${v.qte}" min="1" max="${maxQ}" oninput="setQty('${ctx}',this.value,${maxQ})">
        <button onclick="changeQty('${ctx}',1)">+</button><span class="muted">/ ${maxQ} en stock</span></div></div>
    <div class="field"><label>Vendeuse</label>
      <input type="text" list="vendeusesList" placeholder="Nom de la vendeuse" value="${esc(v.vendeuse)}" oninput="state.${ctx}.vendeuse=this.value">
      <datalist id="vendeusesList">${state.meta.vendeuses.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="total-line"><span class="lbl">Total à encaisser</span><span class="val">${money(total)}</span></div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="submitVente()" ${v.qte<1||v.qte>maxQ?'disabled':''}>Enregistrer la vente</button>
  `;
}
function renderSearchResults(results, ctx){
  if(!results.length) return '';
  return results.map(a=>{
    const totalStock=(a.variants||[]).reduce((s,vr)=> s+(vr.stock||0),0);
    return `<div class="search-item" onclick="selectArticle('${ctx}','${a.id}')">
      <div><div class="nom">${esc(a.nom)}</div><div class="meta">${esc(a.categorie||'—')} · stock total ${totalStock}</div></div>
      <div class="prix">${money(a.prixVente)}</div></div>`;
  }).join('');
}
function onSearch(ctx, q){
  state[ctx].query = q;
  state[ctx].results = q.trim().length===0? [] : state.articles.filter(a=> !a.supprime && a.nom.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  const box = document.getElementById(ctx+'Results'); if(box) box.innerHTML = renderSearchResults(state[ctx].results, ctx);
}
function selectArticle(ctx,id){ state[ctx].article = state.articles.find(x=>x.id===id); state[ctx].variantId=null; state[ctx].qte=1; render(); }
function selectVariant(ctx,variantId){ const variant=state[ctx].article.variants.find(v=>v.id===variantId); if((variant.stock||0)<=0) return; state[ctx].variantId=variantId; state[ctx].qte=1; render(); }
function resetSelection(ctx){ state[ctx].article=null; state[ctx].variantId=null; state[ctx].qte=1; state[ctx].query=''; state[ctx].results=[]; render(); }
function changeQty(ctx,delta){ const variant=state[ctx].article.variants.find(v=>v.id===state[ctx].variantId); const max=variant?variant.stock:1; let q=state[ctx].qte+delta; if(q<1)q=1; if(q>max)q=max; state[ctx].qte=q; render(); }
function setQty(ctx,val,max){ let q=parseInt(val,10); if(isNaN(q)||q<1)q=1; if(q>max)q=max; state[ctx].qte=q; render(); }

async function submitVente(){
  const v = state.vente; if(!v.article||!v.variantId) return;
  const { db, doc, runTransaction, collection, serverTimestamp } = window.__fb;
  try{
    await runTransaction(db, async (tx)=>{
      const artRef = doc(db,'articles', v.article.id);
      const artSnap = await tx.get(artRef);
      if(!artSnap.exists()) throw new Error('Article introuvable.');
      const art = artSnap.data();
      const stockAvant = totalStock(art);
      const variants = art.variants.map(vr=> vr.id===v.variantId ? {...vr} : vr);
      const variant = variants.find(vr=> vr.id===v.variantId);
      if(!variant || variant.stock < v.qte) throw new Error('Stock insuffisant (peut-être vendu entre-temps).');
      variant.stock -= v.qte;
      const stockApres = variants.reduce((s,vr)=>s+(vr.stock||0),0);
      const artUpdate = { variants };
      if(stockAvant>0 && stockApres===0) artUpdate.stockZeroDepuis = new Date().toISOString();
      tx.update(artRef, artUpdate);
      const venteRef = doc(collection(db,'ventes'));
      const total = v.qte*art.prixVente, profit = v.qte*(art.prixVente-art.prixAchat);
      tx.set(venteRef, {
        date: new Date().toISOString(), articleId: v.article.id, articleNom: art.nom,
        variantId: v.variantId, taille: variant.taille||'', couleur: variant.couleur||'',
        qte: v.qte, prixVenteUnit: art.prixVente, prixAchatUnit: art.prixAchat,
        total, profit, vendeuse: v.vendeuse||'', source:'boutique'
      });
    });
    if(v.vendeuse && !state.meta.vendeuses.includes(v.vendeuse)){
      state.meta.vendeuses.push(v.vendeuse);
      const { db, doc, setDoc } = window.__fb;
      await setDoc(doc(db,'meta','config'), state.meta);
    }
    showTicket({title:'VENTE ENREGISTRÉE', lines:[[v.article.nom,''],[variantLabel(v.article.variants.find(x=>x.id===v.variantId)),'x'+v.qte],['Total', money(v.qte*v.article.prixVente)]]});
    const keep = v.vendeuse;
    state.vente = { query:'', results:[], article:null, variantId:null, qte:1, vendeuse:keep };
    render();
  }catch(e){ alert(e.message || 'Erreur lors de la vente.'); }
}

let cropState = null;

function onPhotoFileSelected(file){
  if(!file) return;

function openCropModal(file){
  const objectUrl = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const viewportW = 280, viewportH = 350;
    const baseScale = Math.max(viewportW / img.naturalWidth, viewportH / img.naturalHeight);
    cropState = {
      objectUrl, img,
      naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight,
      viewportW, viewportH, baseScale, zoom: 1, scale: baseScale,
      offsetX: (viewportW - img.naturalWidth*baseScale)/2,
      offsetY: (viewportH - img.naturalHeight*baseScale)/2,
      dragging: false, lastX: 0, lastY: 0
    };
    openModal(renderCropModal());
    wireCropEvents();
  };
  img.onerror = () => { URL.revokeObjectURL(objectUrl); alert('Image invalide.'); };
  img.src = objectUrl;
}

  return `

function updateCropImgStyle(){
  const el = document.getElementById('cropImg');
  if(!el || !cropState) return;
  el.style.width = (cropState.naturalWidth*cropState.scale)+'px';
  el.style.height = (cropState.naturalHeight*cropState.scale)+'px';
  el.style.left = cropState.offsetX+'px';
  el.style.top = cropState.offsetY+'px';
}

function clampCropOffsets(){
  const dw = cropState.naturalWidth*cropState.scale;
  const dh = cropState.naturalHeight*cropState.scale;
  const minX = Math.min(0, cropState.viewportW - dw);
  const minY = Math.min(0, cropState.viewportH - dh);
  cropState.offsetX = Math.max(minX, Math.min(0, cropState.offsetX));
  cropState.offsetY = Math.max(minY, Math.min(0, cropState.offsetY));
}

function wireCropEvents(){
  const vp = document.getElementById('cropViewport');
  if(!vp || !cropState) return;
  vp.onpointerdown = (e) => {
    cropState.dragging = true;
    cropState.lastX = e.clientX; cropState.lastY = e.clientY;
    vp.setPointerCapture(e.pointerId);
  };
  vp.onpointermove = (e) => {
    if(!cropState || !cropState.dragging) return;
    const dx = e.clientX - cropState.lastX;
    const dy = e.clientY - cropState.lastY;
    cropState.lastX = e.clientX; cropState.lastY = e.clientY;
    cropState.offsetX += dx; cropState.offsetY += dy;
    clampCropOffsets();
    updateCropImgStyle();
  };
  const endDrag = () => { if(cropState) cropState.dragging = false; };
  vp.onpointerup = endDrag;
  vp.onpointercancel = endDrag;
  vp.onpointerleave = endDrag;
}

function onCropZoom(val){
  if(!cropState) return;
  const newZoom = parseFloat(val);
  const oldScale = cropState.scale;
  const cx = (cropState.viewportW/2 - cropState.offsetX) / oldScale;
  const cy = (cropState.viewportH/2 - cropState.offsetY) / oldScale;
  cropState.zoom = newZoom;
  cropState.scale = cropState.baseScale * newZoom;
  cropState.offsetX = cropState.viewportW/2 - cx*cropState.scale;
  cropState.offsetY = cropState.viewportH/2 - cy*cropState.scale;
  clampCropOffsets();
  updateCropImgStyle();
}

function cancelCrop(){
  if(cropState){ URL.revokeObjectURL(cropState.objectUrl); cropState = null; }
  document.getElementById('f_photo_file').value = '';
  closeModal();
  openModal(renderArticleModal());
}

async function confirmCrop(){
  const cs = cropState;
  const outW = 900, outH = Math.round(900 * cs.viewportH / cs.viewportW);
  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext('2d');
  const sx = -cs.offsetX / cs.scale;
  const sy = -cs.offsetY / cs.scale;
  const sW = cs.viewportW / cs.scale;
  const sH = cs.viewportH / cs.scale;
  ctx.drawImage(cs.img, sx, sy, sW, sH, 0, 0, outW, outH);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
  URL.revokeObjectURL(cs.objectUrl);
  cropState = null;
  document.getElementById('f_photo_file').value = '';
  closeModal();
  openModal(renderArticleModal());
  await uploadCroppedPhoto(blob);
}

async function uploadCroppedPhoto(blob){

        <span class="muted">Envoi en cours…</span>
      </div>
    `;
  }
  try{
    const url = await uploadToImgbb(blob);
    articleFormDraft.photoUrl = url;
  }catch(e){
    alert("Erreur lors de l'envoi de la photo : " + (e.message || e));
  }finally{
    URL.revokeObjectURL(localUrl);
    const w = document.getElementById('photoFieldWrap');
    if(w) w.innerHTML = renderPhotoField();
  }
}

async function uploadToImgbb(blob){
  const formData = new FormData();
  formData.append('image', blob, 'photo.jpg');
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: 'POST',
    body: formData
  });
  if(!res.ok) throw new Error('Échec de l\'envoi (HTTP '+res.status+').');
  const data = await res.json();
  if(!data || !data.data || !data.data.url) throw new Error('Réponse imgbb invalide.');
  return data.data.url;
}

async function saveArticleForm(){
  const nom = document.getElementById('f_nom').value.trim();
  if(!nom){ alert('Le nom est obligatoire.'); return; }
  const categorie = document.getElementById('f_cat').value.trim();
  const prixAchat = parseFloat(document.getElementById('f_achat').value)||0;
  const prixVente = parseFloat(document.getElementById('f_vente').value)||0;
  const photoUrl = articleFormDraft.photoUrl || '';
  const variants = Array.from(document.querySelectorAll('.variant-row')).map(row=>({
    id: row.dataset.vid,
    taille: row.querySelector('[data-field=taille]').value.trim(),
    couleur: row.querySelector('[data-field=couleur]').value.trim(),
    stock: parseInt(row.querySelector('[data-field=stock]').value,10)||0
  }));
  const { db, doc, setDoc, addDoc, collection } = window.__fb;
  const existingArticle = articleFormDraft.id ? state.articles.find(x=>x.id===articleFormDraft.id) : null;
  const stockAvant = existingArticle ? totalStock(existingArticle) : 0;
  const stockApres = variants.reduce((s,v)=>s+(v.stock||0),0);
  let stockZeroDepuis = existingArticle ? (existingArticle.stockZeroDepuis || null) : null;
  if(stockApres>0) stockZeroDepuis = null;
  else if(stockAvant>0 && stockApres===0) stockZeroDepuis = new Date().toISOString();
  const record = { nom, categorie, prixAchat, prixVente, photoUrl, variants, stockZeroDepuis };
  if(articleFormDraft.id){ await setDoc(doc(db,'articles',articleFormDraft.id), record); }
  else{ await addDoc(collection(db,'articles'), record); }
  if(categorie && !state.meta.categories.includes(categorie)){
    state.meta.categories.push(categorie);
    await setDoc(doc(db,'meta','config'), state.meta);
  }
  closeModal(); render();
}

    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button></div>
  `);

async function confirmerPaiement(id, moyen){
  closeModal();
  const nouveauStatut = moyen==='boutique' ? 'payé_boutique' : 'payé_mobile';
  const { db, doc, runTransaction, collection } = window.__fb;
  try{
    await runTransaction(db, async (tx)=>{
      const preRef = doc(db,'precommandes', id);
      const preSnap = await tx.get(preRef);
      if(!preSnap.exists()) throw new Error('Précommande introuvable.');
      const pre = preSnap.data();
      if(pre.statut !== 'non_payé') throw new Error('Cette précommande a déjà été traitée.');

      // lire tous les articles concernés d'abord (Firestore exige les lectures avant les écritures)
      const artRefs = {};
      const artData = {};
      for(const it of pre.items){
        if(!artRefs[it.articleId]){
          artRefs[it.articleId] = doc(db,'articles', it.articleId);
          const s = await tx.get(artRefs[it.articleId]);
          if(!s.exists()) throw new Error("Un article de la commande n'existe plus.");
          artData[it.articleId] = s.data();
        }
      }
      // vérifier stock suffisant pour chaque ligne
      const workingVariants = {};
      for(const it of pre.items){
        const art = artData[it.articleId];
        if(!workingVariants[it.articleId]) workingVariants[it.articleId] = art.variants.map(v=>({...v}));
        const variant = workingVariants[it.articleId].find(v=> v.id===it.variantId);
        if(!variant || variant.stock < it.qte) throw new Error('Stock insuffisant pour '+it.articleNom+' — ajuste avant de valider.');
        variant.stock -= it.qte;
      }
      // écrire les mises à jour de stock
      for(const artId in workingVariants){
        const stockAvant = totalStock(artData[artId]);
        const stockApres = workingVariants[artId].reduce((s,vr)=>s+(vr.stock||0),0);
        const artUpdate = { variants: workingVariants[artId] };
        if(stockAvant>0 && stockApres===0) artUpdate.stockZeroDepuis = new Date().toISOString();
        tx.update(artRefs[artId], artUpdate);
      }
      // créer les ventes correspondantes
      for(const it of pre.items){
        const art = artData[it.articleId];
        const venteRef = doc(collection(db,'ventes'));
        const total = it.qte*it.prixVenteUnit, profit = it.qte*(it.prixVenteUnit-art.prixAchat);
        tx.set(venteRef, {
          date: new Date().toISOString(), articleId: it.articleId, articleNom: it.articleNom,
          variantId: it.variantId, taille: it.taille||'', couleur: it.couleur||'',
          qte: it.qte, prixVenteUnit: it.prixVenteUnit, prixAchatUnit: art.prixAchat,
          total, profit, vendeuse: pre.clientNom ? 'Précommande — '+pre.clientNom : 'Précommande', source: 'precommande',
          moyenPaiementReel: moyen
        });
      }
      tx.update(preRef, { statut: nouveauStatut, datePaiement: new Date().toISOString() });
    });
    showTicket({title:'PRÉCOMMANDE PAYÉE', lines:[['Stock mis à jour',''],['Vente enregistrée','✓']]});
    render();
  }catch(e){ alert(e.message || 'Erreur lors du traitement.'); }
}

  if(!confirm('Annuler cette précommande ? (aucun impact sur le stock)')) return;
  const { db, doc, updateDoc } = window.__fb;
  await updateDoc(doc(db,'precommandes', id), { statut:'annulé' });
  render();
}

  if(items.length===0){
    return header + '<div class="card"><div class="empty">Rien à afficher.</div></div>';
  }
  const rows = items.map(i=>`<tr><td class="mono muted">${fmtDate(i.date)}</td><td>${i.type==='vente'?'<span class="badge ok">Vente</span>':'<span class="badge low">Perte</span>'}</td>
        <td>${esc(i.articleNom)}</td><td class="muted">${esc([i.taille,i.couleur].filter(Boolean).join(' / ')||'—')}</td><td class="num mono">${i.qte}</td>
        <td class="num mono">${i.type==='vente'? money(i.total) : '−'+money(i.qte*(i.prixAchatUnit||0))}</td>
        <td class="muted">${esc(i.type==='vente'? (i.vendeuse||'—') : i.raison)}</td></tr>`).join('');
  const cards = items.map(i=>{
    const badge = i.type==='vente' ? '<span class="badge ok">Vente</span>' : '<span class="badge low">Perte</span>';
    const montant = i.type==='vente' ? money(i.total) : '−'+money(i.qte*(i.prixAchatUnit||0));
    const variante = [i.taille,i.couleur].filter(Boolean).join(' / ');
    const who = i.type==='vente' ? (i.vendeuse||'—') : i.raison;
    return `
      <div class="card hist-card">
        <div class="flex-between">
          <span class="mono muted">${fmtDate(i.date)}</span>
          ${badge}
        </div>
        <div style="font-weight:600;margin-top:6px;">${esc(i.articleNom)}</div>
        ${variante ? `<div class="muted" style="font-size:.78rem;">${esc(variante)}</div>` : ''}
        <div class="flex-between" style="margin-top:8px;">
          <span class="muted">Qté ${i.qte}</span>
          <span class="mono" style="font-weight:700;">${montant}</span>
        </div>
        <div class="muted" style="margin-top:4px;font-size:.78rem;">${esc(who)}</div>
      </div>
    `;
  }).join('');
  return header + `
    <div class="card table-wrap">
      <table><thead><tr><th>Date</th><th>Type</th><th>Article</th><th>Variante</th><th class="num">Qté</th><th class="num">Montant</th><th>Vendeuse / raison</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="cards-wrap">${cards}</div>
  `;
}
function setHistFilter(f){ histFilter=f; render(); }

/* ---------------------------------------------------------
   EXPORT CSV
--------------------------------------------------------- */
function csvEscape(val){
  if(val==null) return '';
  const str = String(val);
  if(/[",\n;]/.test(str)) return '"'+str.replace(/"/g,'""')+'"';
  return str;
}
function toCSV(rows, headers){
  const lines = [headers.join(',')];
  rows.forEach(r=> lines.push(headers.map(h=> csvEscape(r[h])).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, csvContent){
  const bom = '﻿';
  const blob = new Blob([bom+csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exporterCSV(){
  const venteHeaders = ['id','date','articleId','articleNom','variantId','taille','couleur','qte','prixVenteUnit','prixAchatUnit','total','profit','vendeuse','source'];
  const venteRows = state.ventes.map(v=> ({
    id:v.id, date:v.date, articleId:v.articleId, articleNom:v.articleNom, variantId:v.variantId,
    taille:v.taille, couleur:v.couleur, qte:v.qte, prixVenteUnit:v.prixVenteUnit, prixAchatUnit:v.prixAchatUnit,
    total:v.total, profit:v.profit, vendeuse:v.vendeuse, source:v.source
  }));
  downloadCSV('ventes.csv', toCSV(venteRows, venteHeaders));

  const perteHeaders = ['id','date','articleId','articleNom','variantId','taille','couleur','qte','prixAchatUnit','raison','vendeuse'];
  const perteRows = state.pertes.map(p=> ({
    id:p.id, date:p.date, articleId:p.articleId, articleNom:p.articleNom, variantId:p.variantId,
    taille:p.taille, couleur:p.couleur, qte:p.qte, prixAchatUnit:p.prixAchatUnit, raison:p.raison, vendeuse:p.vendeuse
  }));
  downloadCSV('pertes.csv', toCSV(perteRows, perteHeaders));

  const articleHeaders = ['id','nom','categorie','prixAchat','prixVente','photoUrl','variantId','taille','couleur','stock'];
  const articleRows = [];
  state.articles.forEach(a=>{
    const variants = (a.variants && a.variants.length) ? a.variants : [{id:'',taille:'',couleur:'',stock:0}];
    variants.forEach(v=> articleRows.push({
      id:a.id, nom:a.nom, categorie:a.categorie, prixAchat:a.prixAchat, prixVente:a.prixVente, photoUrl:a.photoUrl||'',
      variantId:v.id, taille:v.taille, couleur:v.couleur, stock:v.stock
    }));
  });
  downloadCSV('articles.csv', toCSV(articleRows, articleHeaders));
}

/* ---------------------------------------------------------
   ACCÈS RAPIDE AU CATALOGUE
--------------------------------------------------------- */
function openCatalogueMenu(){
  openModal(`
    <h3>🛍 Catalogue</h3>
    <p class="muted" style="margin-bottom:16px;">Consulte ou partage le catalogue avec tes clientes.</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-primary" style="width:100%;" onclick="window.open('catalogue.html','_blank')">🔗 Ouvrir le catalogue</button>
      <button class="btn btn-ghost" style="width:100%;" onclick="copierLienCatalogue(this)">📋 Copier le lien</button>
      ${(typeof navigator!=='undefined' && navigator.share) ? `<button class="btn btn-ghost" style="width:100%;" onclick="partagerCatalogue()">📤 Partager</button>` : ''}
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fermer</button></div>
  `);
}
async function copierLienCatalogue(btn){
  const url = window.location.origin + '/catalogue.html';
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(url);
    } else {
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const original = btn.textContent;
    btn.textContent = '✓ Lien copié !';
    btn.disabled = true;
    setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 2000);
  }catch(e){
    alert("Impossible de copier automatiquement. Voici le lien :\n" + url);
  }
}
async function partagerCatalogue(){
  const url = window.location.origin + '/catalogue.html';
  try{
    await navigator.share({ title: state.meta.nomBoutique || 'Boutique', text: 'Découvrez notre catalogue :', url });
  }catch(e){ /* partage annulé par l'utilisatrice */ }
}

function libelleSuppressionRaison(raison){
  if(raison==='stock_zero_60_jours') return 'Stock à 0 depuis plus de 60 jours (automatique)';
  if(raison==='manuel') return 'Suppression manuelle';
  return raison || '—';
}
function renderCorbeilleSection(){
  const corbeille = state.articles.filter(a=> a.supprime);
  if(corbeille.length===0) return '<div class="muted" style="font-size:.82rem;">La corbeille est vide.</div>';
  return corbeille.map(a=> `
    <div class="card" style="padding:12px 14px;margin-bottom:8px;">
      <div class="flex-between">
        <strong>${esc(a.nom)}</strong>
        <span class="muted mono" style="font-size:.74rem;">${fmtDate(a.supprimeLe)}</span>
      </div>
      <div class="muted" style="font-size:.78rem;margin-top:2px;">${esc(libelleSuppressionRaison(a.supprimeRaison))}</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="restaurerArticle('${a.id}')">↩ Restaurer</button>
        <button class="btn btn-ghost btn-sm" style="flex:1;color:var(--danger);" onclick="supprimerDefinitivement('${a.id}')">Supprimer définitivement</button>
      </div>
    </div>
  `).join('');
}
function refreshCorbeilleSection(){
  const el = document.getElementById('corbeilleSection');
  if(el) el.innerHTML = renderCorbeilleSection();
  render();
}
async function restaurerArticle(id){
  const { db, doc, updateDoc } = window.__fb;
  await updateDoc(doc(db,'articles',id), { supprime:false, supprimeLe:null, supprimeRaison:null, stockZeroDepuis:null });
  refreshCorbeilleSection();
}
async function supprimerDefinitivement(id){
  if(!confirm('Supprimer définitivement cet article ? Cette action est irréversible.')) return;
  const { db, doc, deleteDoc } = window.__fb;
  await deleteDoc(doc(db,'articles',id));
  refreshCorbeilleSection();
}
async function saveSettings(){
  const nomBoutique = document.getElementById('s_titre').value.trim() || 'Atelier — Gestion';
  state.meta.nomBoutique = nomBoutique;
  state.meta.devise = document.getElementById('s_devise').value.trim() || '€';
  state.meta.seuil = parseInt(document.getElementById('s_seuil').value,10) || 0;
  state.meta.whatsapp = document.getElementById('s_whatsapp').value.trim();
  state.meta.adresse = {
    province: document.getElementById('s_province').value.trim(),
    ville: document.getElementById('s_ville').value.trim(),
    quartier: document.getElementById('s_quartier').value.trim(),
    reference: document.getElementById('s_reference').value.trim()
  };
  state.meta.paiementMobile = {
    airtel: document.getElementById('s_airtel').value.trim(),
    orange: document.getElementById('s_orange').value.trim()
  };
  const { db, doc, setDoc } = window.__fb;
  await setDoc(doc(db,'meta','config'), state.meta);
  document.getElementById('shopTitle').textContent = nomBoutique;
  closeModal(); render();
}

let ticketTimer=null;
function showTicket({title,lines}){
  const el = document.getElementById('ticket-toast');
  el.innerHTML = `<div class="t-title">${esc(title)}</div><hr>` + lines.map(l=>`<div class="t-line"><span>${esc(l[0])}</span><span>${esc(l[1])}</span></div>`).join('') + `<hr><div class="t-line"><span>${new Date().toLocaleTimeString('fr-FR')}</span><span>merci !</span></div>`;
  el.classList.add('show'); clearTimeout(ticketTimer); ticketTimer=setTimeout(()=> el.classList.remove('show'), 3200);
}
